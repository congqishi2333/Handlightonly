# ============================================
#  极简手持光源光影 / Hand Light Only
#  只做一件事：手持发光方块时在相机位置加一盏点光源
# ============================================

# 关掉 Iris 注入的旧面光：各朝向亮度改成 shader 里的滑块，
# 默认值就是原版系数（顶 1.0 / 南北 0.8 / 东西 0.6 / 底 0.5）
oldLighting=false

# 主手 / 副手独立读取（shader 里取两者较大值）
oldHandLight=false

# 关闭 OptiFine 那条 CPU 动态光，避免和 shader 自己算的手光叠加
dynamicHandLight=false

# 启用阴影 pass：Iris 会用默认 shadow shader 渲染 shadowtex0/1，
# gbuffers 里只采样一次 shadowtex1，用来压暗被遮挡的天光
shadow.enabled=true

#  Shader Pack Settings 里显示的滑块
screen = [FACE_LIGHT] HL_STRENGTH HL_FALLOFF
screen.FACE_LIGHT = HL_FACE_TOP HL_FACE_NS HL_FACE_EW HL_FACE_BOTTOM HL_FACE_PLANT
sliders = HL_STRENGTH HL_FALLOFF HL_FACE_TOP HL_FACE_NS HL_FACE_EW HL_FACE_BOTTOM HL_FACE_PLANT
