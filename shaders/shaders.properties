# ============================================
#  极简手持光源光影 / Hand Light Only
#  几何 pass 全部用 Iris 默认渲染；只有 final.fsh 叠加一层手光
# ============================================

# 不写 oldLighting：本包没有 gbuffers_*，原版方向面光由 Iris 默认渲染负责

# 主手 / 副手分别读取，shader 里取较大值
oldHandLight=false

# 不采样阴影贴图，没必要跑 shadow pass
shadow.enabled=false

# 游戏内 Shader Pack Settings 只显示这几个手光选项
screen = HL_STRENGTH HL_FALLOFF HL_TINT_R HL_TINT_G HL_TINT_B
sliders = HL_STRENGTH HL_FALLOFF HL_TINT_R HL_TINT_G HL_TINT_B
