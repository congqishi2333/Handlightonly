# ============================================
#  极简手持光源光影 / Hand Light Only
#  几何 pass 全部用 Iris 默认渲染；只有 final.fsh 叠加一层手光
# ============================================

# 保留原版方向面光（顶面 1.0 / 南北 0.8 / 东西 0.6 / 底面 0.5）
oldLighting=true

# 主手 / 副手分别读取，shader 里取较大值
oldHandLight=false

# 关掉 OptiFine 的 CPU 动态手光，避免和 final 里这层重复
dynamicHandLight=false

# 不采样阴影贴图，没必要跑 shadow pass
shadow.enabled=false
