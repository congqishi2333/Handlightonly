# ============================================
#  极简手持光源光影 / Hand Light Only
#  只做一件事：手持发光方块时在相机位置加一盏点光源
# ============================================

# 关掉 Iris 注入的旧面光，改在 fragment 里按 normalWorld 手动还原，
# 避免某些 Iris 版本下墙面（侧面）拿不到 0.8 的系数而偏亮
oldLighting=false

# 主手 / 副手独立读取（shader 里取两者较大值）
oldHandLight=false

# 关闭 OptiFine 那条 CPU 动态光，避免和 shader 自己算的手光叠加
dynamicHandLight=false

# 启用阴影 pass：Iris 会用默认 shadow shader 渲染 shadowtex0/1，
# gbuffers 里只采样一次 shadowtex1，用来压暗被遮挡的天光
shadow.enabled=true
